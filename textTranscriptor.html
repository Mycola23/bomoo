<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
        <!-- change it on other-->
        <title>Bomoo</title>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <div class="wrapper wrapper-record">
            <main class="main__rc-testcontainer">
                <div class="custom-audio">
                    <!-- Play/Pause button -->
                    <button class="custom-audio__play-pause">▶</button>

                    <!-- Seek bar with time display -->
                    <div class="custom-audio__seek-container">
                        <input type="range" class="custom-audio__seek-bar" min="0" value="0" step="0.1" />
                        <div class="custom-audio__time">
                            <span class="custom-audio__current-time">00:00</span> /
                            <span class="custom-audio__duration">00:00</span>
                        </div>
                    </div>

                    <!-- Volume control -->
                    <input type="range" class="custom-audio__volume" min="0" max="1" step="0.01" value="1" />
                </div>
            </main>

            <!-- Hidden audio element -->
            <audio id="audio" src="testmusic/KB_-_Church_Clap_CeeNaija.com_.mp3"></audio>
        </div>
        <script type="module" src="js/test.js"></script>
    </body>
</html>
